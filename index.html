<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181c24">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <script>
    if (location.hostname === "christmas-tree-ascii-art.onrender.com") {
      location.replace("https://christmas-tree-ascii-art-server.onrender.com" + location.pathname + location.search + location.hash);
    }
  </script>
  <title>ASCII Christmas Tree</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./geometry.js"></script>
  <script defer src="./village.js"></script>
  <script defer src="./santa.js"></script>
  <script defer src="./chat-snow.js"></script>
  <script defer src="./scene.js"></script>
  <script defer src="./music.js"></script>
  <script defer src="./chat.js"></script>
  <script defer src="./chat-layout.js"></script>
</head>
<body>
  <main aria-label="ASCII 크리스마스 트리">
    <canvas id="scene" role="img" aria-label="기둥에 잎이 자라고 장식과 선물이 입자로 모이며, 하늘에서 별이 내려와 반짝이는 회전 ASCII 크리스마스 트리"></canvas>
    <span id="time" aria-hidden="true"></span>
    <div class="controls">
      <button id="music-toggle" type="button" aria-pressed="false">음악 재생</button>
      <label class="volume-control" for="music-volume"><span>&#48380;&#47464;</span><input id="music-volume" type="range" min="0" max="100" value="40" aria-label="Music volume"><output id="volume-value" for="music-volume">40%</output></label>
      <button id="replay" type="button">처음부터</button>
      <button id="toggle" type="button">일시정지</button>
    </div>
    <p id="music-status" role="status"></p>
    <noscript>애니메이션을 보려면 JavaScript를 켜 주세요.</noscript>
  </main>
  <aside id="chat-panel" aria-label="Anonymous chat">
    <div id="messages" role="log" aria-label="Messages" aria-live="polite"></div>
    <form id="chat-form">
      <div class="chat-compose"><label for="chat-input">&#51061;&#47749; :</label><input id="chat-input" name="message" maxlength="300" autocomplete="off" required><button id="chat-send" type="submit">&#48372;&#45236;&#44592;</button></div>
      <p id="chat-status" role="status" hidden></p>
    </form>
  </aside>
  <audio id="background-music" src="./assets/christmas.mp3" loop preload="metadata" hidden></audio>
</body>
</html>
