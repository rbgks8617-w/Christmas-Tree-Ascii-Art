services:
  - type: web
    name: christmas-tree
    runtime: python
    plan: free
    buildCommand: python -m compileall -q server.py
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: CHAT_SECRET
        generateValue: true
      - key: CHAT_ADMIN_PASSWORD
        generateValue: true
